name: Android APK Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: resources/android-project

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'


      - name: Setup Compatible Gradle Version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.3' 

      - name: Remove Incompatible Modern SDKs
        run: |
          # Remove platforms and build-tools
          rm -rf $ANDROID_HOME/platforms/android-3[4-9]*
          rm -rf $ANDROID_HOME/build-tools/3[4-9]*
          
          # Remove system-images (This is what caused the latest crash)
          rm -rf $ANDROID_HOME/system-images/android-3[4-9]*
          
          # Remove modern sources and addons just to be safe
          rm -rf $ANDROID_HOME/sources/android-3[4-9]*
          rm -rf $ANDROID_HOME/add-ons/addon-google_apis-google-3[4-9]*


      - name: Generate Missing Gradle Wrapper
        run: gradle wrapper

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Fetch Prebuilt Native Libraries and ROM Assets
        run: |
          mkdir -p app/src/main/jniLibs app/src/main/assets
          curl -sL https://github.com/MCJack123/craftos2/releases/download/v2.8.3/CraftOS-PC.apk -o /tmp/official.apk
          unzip -q /tmp/official.apk 'lib/*' 'assets/lua/*' -d /tmp/apk_contents
          cp -r /tmp/apk_contents/lib/* app/src/main/jniLibs/
          cp -r /tmp/apk_contents/assets/lua app/src/main/assets/
          rm -rf /tmp/official.apk /tmp/apk_contents

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: craftos-pc-debug-apk
          path: resources/android-project/app/build/outputs/apk/debug/*.apk
          retention-days: 14
